server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: application-service
          uri: lb://application-service
          predicates:
            - Path=/api/v1/applications/**

        - id: nlp-service
          uri: lb://nlp-service
          predicates:
            - Path=/api/v1/nlp/**

        - id: ml-service
          uri: lb://ml-service
          predicates:
            - Path=/api/v1/ml/**

        - id: anomaly-service
          uri: lb://anomaly-service
          predicates:
            - Path=/api/v1/anomalies/**

        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

